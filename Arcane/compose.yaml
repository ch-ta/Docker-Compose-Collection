services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: Arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.arcane/data:/app/data
      - ${HOME}/.arcane/builds:/builds
      - ${HOME}/.arcane/backups:/backups
      # Optional host project mount:
      - ${HOME}/docker:/app/data/projects
    environment:
      - APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
#      - ENCRYPTION_KEY=xxxxxxxxxxxxxxxxxxxxxx
#      - JWT_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxx
      - TZ=America/Los_Angeles
    cgroup: host
    healthcheck:
      test:
        ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    env_file:
      - ${HOME}/.arcane/.env

volumes:
  arcane-data:
